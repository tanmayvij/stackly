name: Deploy to Firebase
on:
  push:
    branches:
      - master

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stackly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npx oxlint . && npx eslint .
      - name: Inject .env
        run: echo "${{ secrets.VITE_ENV }}" > .env
      - name: Build frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: stackly-frontend/dist

  prepare_functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java (required by the Firestore/Storage emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install functions dependencies
        run: npm ci
      - name: Lint functions
        run: npm run lint
      - name: Test functions (pure)
        run: npm test
      - name: Test functions (emulator + rules)
        run: npm run test:emulator
      - name: Build functions
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: |
            functions/lib
            functions/package.json
            functions/package-lock.json

  deploy:
    needs: [build_frontend, prepare_functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: stackly-frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: functions
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci --omit=dev
      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GHL_BUILDER_161D7 }}' > /tmp/sa.json
          npx firebase-tools deploy --project ghl-builder-161d7
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
